name: CanoKey USB/IP integration

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

env:
  CANOKEY_USBIP_SHA: 5f7e35841d0245f0c5c66089bfa170387395ef6e

jobs:
  firmware-catalog:
    name: Resolve historical firmware catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      firmwares: ${{ steps.catalog.outputs.firmwares }}

    steps:
      - name: Check out canokey-usbip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: canokeys/canokey-usbip
          ref: ${{ env.CANOKEY_USBIP_SHA }}
          path: external/canokey-usbip
          submodules: false
          persist-credentials: false

      - name: Export historical release matrix
        id: catalog
        shell: bash
        run: |
          firmwares="$(external/canokey-usbip/compat/list-firmwares --release-map --compact)"
          [[ "$(jq 'length' <<<"$firmwares")" -gt 0 ]]
          echo "firmwares=$firmwares" >> "$GITHUB_OUTPUT"

  smoke:
    name: Ubuntu 24.04 / firmware ${{ matrix.firmware.id }}
    needs: firmware-catalog
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        firmware: ${{ fromJSON(needs.firmware-catalog.outputs.firmwares) }}
    env:
      CANOKEY_FIRMWARE_ID: ${{ matrix.firmware.id }}
      CANOKEY_CORE_REF: ${{ matrix.firmware.core_commit }}

    steps:
      - name: Check out ckman
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0

      # Upgrade this SHA only after validating the new compat/run contract and
      # firmware catalog in a pull request.
      - name: Check out canokey-usbip
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          repository: canokeys/canokey-usbip
          ref: ${{ env.CANOKEY_USBIP_SHA }}
          path: external/canokey-usbip
          submodules: false
          persist-credentials: false

      - name: Report runner environment
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/canokey-usbip-artifacts"
          mkdir -p "$artifact_dir"
          exec > >(tee -a "$artifact_dir/preflight.log") 2>&1
          uname -a
          uname -r
          lsb_release -a || true

      - name: Install Ubuntu USB/IP and build dependencies
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/canokey-usbip-artifacts/preflight.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            hwdata \
            kmod \
            libccid \
            libpcsclite-dev \
            linux-tools-common \
            ninja-build \
            openssl \
            pcsc-tools \
            pcscd \
            pkg-config \
            python3-jinja2 \
            python3-jsonschema \
            swig \
            udev \
            usbutils

      - name: Require kernel-matched vhci_hcd
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/canokey-usbip-artifacts"
          mkdir -p "$artifact_dir"
          exec > >(tee -a "$artifact_dir/preflight.log") 2>&1

          kernel_release="$(uname -r)"
          module_package="linux-modules-extra-${kernel_release}"
          tools_package="linux-tools-${kernel_release}"

          diagnose_kernel() {
            echo "=== vhci_hcd diagnostics ==="
            uname -r
            apt-cache policy "$module_package" || true
            apt-cache policy "$tools_package" || true
            find "/lib/modules/${kernel_release}" \
              \( -iname '*vhci*' -o -iname '*usbip*' \) -print || true
            grep USBIP "/boot/config-${kernel_release}" || true
          }

          echo "Running kernel: ${kernel_release}"
          if modinfo vhci_hcd; then
            echo "vhci_hcd is already available for ${kernel_release}."
          else
            echo "vhci_hcd is not installed; checking ${module_package}."
            if ! apt-cache show "$module_package" >/dev/null 2>&1; then
              diagnose_kernel
              echo "ERROR: matching linux-modules-extra package unavailable for GitHub-hosted kernel ${kernel_release}"
              exit 1
            fi
            if ! sudo apt-get install -y "$module_package"; then
              diagnose_kernel
              echo "ERROR: failed to install exact kernel module package ${module_package}"
              exit 1
            fi
          fi

          if ! modinfo vhci_hcd; then
            diagnose_kernel
            echo "ERROR: GitHub-hosted kernel ${kernel_release} does not provide vhci_hcd"
            exit 1
          fi
          if ! sudo modprobe vhci_hcd; then
            diagnose_kernel
            echo "ERROR: GitHub-hosted kernel ${kernel_release} cannot load vhci_hcd"
            exit 1
          fi

          echo "=== HID kernel configuration ==="
          grep -E 'CONFIG_(USB_HID|HIDRAW|HID_GENERIC)' \
            "/boot/config-${kernel_release}" || true
          if modinfo usbhid >/dev/null 2>&1; then
            if ! sudo modprobe usbhid; then
              echo "WARNING: ${kernel_release} provides usbhid but it could not be loaded."
              echo "canokey-usbip readiness will determine whether HID is usable."
            fi
          elif grep -q '^CONFIG_USB_HID=y' "/boot/config-${kernel_release}"; then
            echo "usbhid is built into ${kernel_release}."
          else
            echo "WARNING: GitHub-hosted kernel ${kernel_release} does not expose usbhid."
            echo "canokey-usbip readiness will determine whether HID is usable."
          fi
          if modinfo hid_generic >/dev/null 2>&1; then
            sudo modprobe hid_generic || \
              echo "WARNING: hid_generic is present but could not be loaded."
          fi

          if ! lsmod | grep -E 'vhci|usbip'; then
            diagnose_kernel
            echo "ERROR: required USB/IP modules are not loaded"
            exit 1
          fi
          lsmod | grep -E 'vhci|usbip|hid' || true
          if ! compgen -G '/sys/devices/platform/vhci_hcd*' >/dev/null; then
            diagnose_kernel
            echo "ERROR: vhci_hcd is loaded but its platform sysfs interface is unavailable"
            exit 1
          fi
          ls -ld /sys/devices/platform/vhci_hcd*

          if ! usbip version; then
            echo "The usbip dispatcher cannot find a client for ${kernel_release}; checking ${tools_package}."
            if ! apt-cache show "$tools_package" >/dev/null 2>&1; then
              diagnose_kernel
              echo "ERROR: matching linux-tools package unavailable for GitHub-hosted kernel ${kernel_release}"
              exit 1
            fi
            if ! sudo apt-get install -y "$tools_package"; then
              diagnose_kernel
              echo "ERROR: failed to install exact USB/IP client package ${tools_package}"
              exit 1
            fi
          fi
          if ! usbip version; then
            diagnose_kernel
            echo "ERROR: usbip client is unavailable for GitHub-hosted kernel ${kernel_release}"
            exit 1
          fi

      - name: Check canokey-usbip host requirements
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/canokey-usbip-artifacts/preflight.log") 2>&1
          external/canokey-usbip/compat/environment

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: .python-version

      - name: Install ckman
        run: |
          uv sync --locked
          # canokey-core 3.1 code generation uses the setup-python interpreter,
          # not Ubuntu's system Python where python3-jsonschema is installed.
          uv pip install --system 'jinja2>=3,<4' 'jsonschema>=4,<5'

      - name: Verify ckman smoke command syntax
        run: |
          uv run ckman --help >/dev/null
          uv run ckman fido --help >/dev/null
          uv run ckman piv --help >/dev/null
          uv run ckman oath --help >/dev/null
          uv run ckman openpgp --help >/dev/null
          echo "ckman integration command syntax verified."

      - name: Configure PC/SC for the noninteractive runner
        shell: bash
        run: |
          exec > >(tee -a "$RUNNER_TEMP/canokey-usbip-artifacts/preflight.log") 2>&1
          if ! pcscd --help 2>&1 | grep -q -- '--disable-polkit'; then
            echo "ERROR: this pcscd build cannot disable interactive polkit authorization"
            exit 1
          fi
          printf '%s\n' 'PCSCD_ARGS=--disable-polkit' | sudo tee /etc/default/pcscd
          sudo systemctl restart pcscd.service
          if ! pgrep -af '[p]cscd.*--disable-polkit'; then
            sudo systemctl status pcscd.service --no-pager || true
            echo "ERROR: pcscd did not start with --disable-polkit"
            exit 1
          fi

      # This job covers PC/SC command lifecycles plus reusable upstream CLI and
      # protocol tests for FIDO, PIV, OATH, and OpenPGP over PC/SC.
      # See tests/integration/usbip/README.md for capability-bound exclusions.
      - name: Run ckman against a virtual CanoKey
        shell: bash
        env:
          CANOKEY_USBIP_DEBUG: "1"
        run: |
          cd "$GITHUB_WORKSPACE"

          capture_usb_bindings() {
            output="$RUNNER_TEMP/canokey-usbip-artifacts/usb-drivers.txt"
            for _ in {1..120}; do
              for vendor_file in /sys/bus/usb/devices/*/idVendor; do
                [[ -f "$vendor_file" ]] || continue
                device="${vendor_file%/idVendor}"
                [[ "$(<"$vendor_file")" == "20a0" ]] || continue
                [[ -f "$device/idProduct" ]] || continue
                [[ "$(<"$device/idProduct")" == "42d4" ]] || continue

                sleep 3
                {
                  echo "Device: $device"
                  for interface in "$device":*; do
                    [[ -d "$interface" ]] || continue
                    echo "=== $interface ==="
                    for attribute in bInterfaceClass bInterfaceSubClass bInterfaceProtocol modalias; do
                      [[ ! -f "$interface/$attribute" ]] || \
                        printf '%s=%s\n' "$attribute" "$(<"$interface/$attribute")"
                    done
                    if [[ -L "$interface/driver" ]]; then
                      echo "driver=$(readlink -f "$interface/driver")"
                    else
                      echo "driver=unbound"
                    fi
                    udevadm info --query=all --path="$interface" || true
                  done
                  echo "=== hidraw ==="
                  find /sys/class/hidraw -maxdepth 2 -print -exec readlink -f {} \; || true
                  echo "=== modules ==="
                  lsmod | grep -E 'vhci|usbip|hid|ccid' || true
                } >"$output" 2>&1
                return
              done
              sleep 0.5
            done
            echo "CanoKey 20a0:42d4 did not appear before the capture timeout." >"$output"
          }

          capture_usb_bindings &
          capture_pid=$!
          set +e
          external/canokey-usbip/compat/run \
            --core-ref "$CANOKEY_CORE_REF" \
            --timeout 240 \
            --require usb \
            --require ccid \
            --require pcsc \
            --test-command "./tests/integration/usbip/smoke.sh" \
            --output-dir "$RUNNER_TEMP/canokey-usbip-artifacts"
          run_status=$?
          set -e
          wait "$capture_pid" || true

          test_stdout="$RUNNER_TEMP/canokey-usbip-artifacts/test.stdout"
          test_stderr="$RUNNER_TEMP/canokey-usbip-artifacts/test.stderr"
          [[ ! -f "$test_stdout" ]] || cat "$test_stdout"
          [[ ! -s "$test_stderr" ]] || cat "$test_stderr" >&2

          if ((run_status != 0)); then
            metadata="$RUNNER_TEMP/canokey-usbip-artifacts/metadata.json"
            if [[ -f "$metadata" ]]; then
              python3 - "$metadata" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as metadata_file:
              metadata = json.load(metadata_file)
          print(
              "ERROR: canokey-usbip phase "
              f"{metadata.get('phase', 'unknown')} failed: "
              f"{metadata.get('failure', 'no failure detail')}"
          )
          PY
            else
              echo "ERROR: canokey-usbip failed before writing metadata (exit ${run_status})"
            fi
            exit "$run_status"
          fi

      - name: Collect hosted runner diagnostics
        if: always()
        shell: bash
        run: |
          artifact_dir="$RUNNER_TEMP/canokey-usbip-artifacts"
          mkdir -p "$artifact_dir"
          sudo dmesg --ctime 2>&1 | tee "$artifact_dir/kernel.log" >/dev/null || true
          {
            echo "=== pcscd defaults ==="
            cat /etc/default/pcscd || true
            echo "=== pcscd process ==="
            pgrep -af '[p]cscd' || true
            echo "=== pcscd service ==="
            systemctl status pcscd.service pcscd.socket --no-pager || true
            echo "=== relevant modules ==="
            lsmod | grep -E 'vhci|usbip|hid|ccid' || true
            echo "=== hidraw after cleanup ==="
            find /sys/class/hidraw -maxdepth 2 -print -exec readlink -f {} \; || true
          } >"$artifact_dir/host-state.txt" 2>&1

      - name: Upload USB/IP diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ckman-usbip-ubuntu24-firmware-${{ env.CANOKEY_FIRMWARE_ID }}
          path: |
            ${{ runner.temp }}/canokey-usbip-artifacts/preflight.log
            ${{ runner.temp }}/canokey-usbip-artifacts/metadata.json
            ${{ runner.temp }}/canokey-usbip-artifacts/build.log
            ${{ runner.temp }}/canokey-usbip-artifacts/usbip.log
            ${{ runner.temp }}/canokey-usbip-artifacts/usbip-port.txt
            ${{ runner.temp }}/canokey-usbip-artifacts/lsusb.txt
            ${{ runner.temp }}/canokey-usbip-artifacts/pcscd.log
            ${{ runner.temp }}/canokey-usbip-artifacts/udev.txt
            ${{ runner.temp }}/canokey-usbip-artifacts/test.stdout
            ${{ runner.temp }}/canokey-usbip-artifacts/test.stderr
            ${{ runner.temp }}/canokey-usbip-artifacts/kernel.log
            ${{ runner.temp }}/canokey-usbip-artifacts/usb-drivers.txt
            ${{ runner.temp }}/canokey-usbip-artifacts/host-state.txt
          if-no-files-found: warn
